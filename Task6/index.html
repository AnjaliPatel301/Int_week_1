
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Keep-like UI (Bootstrap)</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
    rel="stylesheet"
/>
 <!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap JS (for collapse toggle) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f7f9fa;
      --accent:#f6e8b7;    /* sidebar highlight */
      --muted:#6b7280;
      --panel:#ffffff;
      --left-bg:#f1f5f9;   /* faint left background strip */
      --topbar:#ffffff;
      --icon-muted:#9aa0a6;
      --shadow: 0 6px 18px rgba(20,20,30,0.06);
      --blue:#2b6cb0;
    }
    html,body{height:100%;background:var(--bg);font-family:"Poppins",system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
    /* layout */
    .app-shell{min-height:100vh; display:flex; flex-direction:column;}
    .topbar{
      background:var(--topbar);
      border-bottom:1px solid rgba(15,23,42,0.04);
      padding:10px 18px;
      box-shadow: var(--shadow);
      z-index:20;
    }
    .topbar .brand {font-weight:600; letter-spacing:0.6px; font-size:18px; color:#333;}
    .topbar .brand .badge-keep{
        display:inline-block;background:#f7e9a9;color:#2c3e50;border-radius:6px;padding:2px 7px;font-size:11px;margin-left:8px;}
    .topbar .search-input{
      max-width:820px;
      width:100%;
      border: 0px ;
      margin:0px auto;
    }

    /* main area */
    .main-row{flex:1; display:flex; ;}
    .left-nav{
      width:250px;
      background:white;
      border-right:1px solid rgba(15,23,42,0.04);
      padding:5px 0px;
      min-height:calc(100vh - 72px);
    }
    .left-nav .logo{
      display:flex;align-items:center;
      gap:12px;padding:5px 0px;
      margin-bottom:14px;
    }
    .left-nav .logo .icon{
      width:36px;
      height:36px;border-radius:8px;
      background:linear-gradient(180deg,#fef7dc,#f7e9a9);display:flex;
      align-items:center;justify-content:center;color:#2b3e4f;
      font-weight:700;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,0.04)
    }
    .nav-item-keep{
         display:flex;
      align-items:center;
      gap:17px;
      padding: 13px 26px ;
      font-weight: 700;   
       border-top-right-radius: 18px;   /* sirf top right */
  border-bottom-right-radius: 18px; /* sirf bottom right */
  border-top-left-radius: 0;       /* left side straight */
  border-bottom-left-radius: 0;   
      color:black;margin-bottom:6px;cursor:pointer;
    }
    .nav-item-keep .label{font-weight:500}
    .nav-item-keep .muted{color:var(--muted);font-size:13px}
    /* active highlight */
    .nav-item-keep.active{background:var(--accent)}

    /* content area */
    .content-area{flex:1;padding:28px 36px;position:relative}
    .composer{
      max-width:900px;margin:0 auto 28px;display:flex;justify-content:center;
    }
    .composer .note-input{
      background:var(--panel);
      width:100%;
      border-radius:10px;
      padding:12px 14px;
      display:flex;align-items:center;gap:10px;
      box-shadow: 0 6px 16px rgba(16,24,40,0.02);
    }
    .note-input input{
      border:0; outline:0; width:100%; font-size:15px; color:#2b3e4f;
    }
    .note-input .icons{display:flex;gap:8px;color:var(--icon-muted);font-size:18px}

    /* center illustration */
    .loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:40px;color:var(--muted)}
    .magnifier{
      width:86px;height:86px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;margin-bottom:18px;
      background:linear-gradient(180deg,#fff,#fafafa);box-shadow:0 6px 16px rgba(2,6,23,0.05);border:1px solid rgba(15,23,42,0.04)
    }
    .magnifier i{font-size:38px;color:rgba(90,100,110,0.55)}
    .loading-wrap p{font-size:15px;color:var(--muted); margin:0}

    /* small left labels */
    .left-nav .small-desc{font-size:12px;color:var(--muted);}
    /* icons color on hover */
    .nav-item-keep:hover{background:rgba(0,0,0,0.02)}
    /* right top icons */
    .top-right-icons{display:flex;align-items:center;gap:10px}
    .round-btn{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--icon-muted);background:transparent;border:0}
    .round-btn:hover{background:rgba(0,0,0,0.03)}
    .avatar{width:36px;height:36px;border-radius:50%;background:#cbd5e1;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600}

    /* responsive tweaks */
    @media (max-width:992px){
      .composer{padding:0 12px}
    }
  </style>
</head>
<body>

  <div class="app-shell">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class=" d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-1">
          <button class="btn btn-light  round-btn" id="menuToggle"> 
            <div class="gb_1c" aria-expanded="false" aria-label="Main menu" role="button" tabindex="0"><i class="bi bi-list fs-5 text-primary-emphasis  fw-bold"></i></div>
          </button>
          <div class="brand d-flex align-items-center">
           
            <span class=" aborted"> <span><img class="w-25" src="https://www.gstatic.com/images/branding/product/2x/keep_2020q4_48dp.png" alt=""></span> Keep</span>
          </div>
        </div>

        <!-- center search -->
        <div class="search-input  border-0">
          <div class="input-group p-1 rounded-2 bg-body-tertiary">
            <span class="input-group-text bg-white bg-body-tertiary border-0 "><i class="bi bi-search"></i></span>
            <input class="form-control border-0 bg-body-tertiary" placeholder="Search" aria-label="Search">
          </div>
        </div>

        <!-- right icons -->
        <div class="top-right-icons">
          <button class="round-btn text-black fw-bold fs-5" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
                    <button class="round-btn text-black  fs-6" title="Settings"><i class="bi bi-view-stacked"></i></button>
          <button class="round-btn text-black  fs-6" title="Settings"><i class="bi bi-gear"></i></button>
          <button class="round-btn text-black  fs-6" title="Grid"><i class="bi bi-grid-3x3-gap-fill"></i></button>

          <div class="avatar bg-danger" >A</div>
        </div>
      </div>
    </header>

    <!-- MAIN -->
    <div class="main-row">

      <!-- LEFT NAV -->
      <aside class="left-nav " >
        <div class="logo">
          

        <nav class="mt-0" style="width: 100%;font-size: 13px;">
          <div class="nav-item-keep active">
            <i class="bi bi-lightbulb" style="color:#b07a00"></i>
            <div>
              <div class="label">Notes</div>
            </div>
          </div>

          <div class="nav-item-keep">
            <i class="bi bi-bell" ></i>
            <div>
              <div class="label">Reminders</div>
            </div>
          </div>

          <div class="nav-item-keep">
            <i class="bi bi-pencil" ></i>
            <div>
              <div class="label">Edit labels</div>
            </div>
          </div>

          <div class="nav-item-keep">
            <i class="ri-inbox-archive-line" ></i>
            <div>
              <div class="label">Archive</div>
            </div>
          </div>

          <div class="nav-item-keep">
            <i class="bi bi-trash" ></i>
            <div>
              <div class="label">Bin</div>
            </div>
          </div>
        </nav>

      </aside>

      <!-- CONTENT -->
      <main class="content-area bg-white">

        <!-- composer (note input) -->
        <div class="composer w-50">
          <div class="note-input shadow ">
            
            <input type="text" placeholder="Take a note..." aria-label="Take a note">
            <div class="icons gap-3">
                <i class="bi bi-check-square text-black" style="font-size:18px;color:var(--icon-muted)"></i>
             <i class="bi bi-pencil-fill text-black" title="Edit"></i>
                <i class="bi bi-card-image text-black" title="Add image"></i>
            </div>
          </div>
        </div>

        <!-- center loading notes -->
        <div class="loading-wrap  " style="margin-top: 170px;">
          <div class="magnifier">
            <i class="bi bi-search"></i>
          </div>
          <p style="font-size:18px;color:var(--muted)">Loading notes...</p>
        </div>

      </main>
    </div>
  </div>

  <!-- Bootstrap JS (bundle includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    menuToggle.addEventListener('click', () => {
  document.querySelector('.left-nav').classList.toggle('d-none');
});

    // small toggle for left nav on small screens
    const menuToggle = document.getElementById('menuToggle');
    if(menuToggle){
      menuToggle.addEventListener('click', () => {
        document.querySelector('.left-nav').classList.toggle('d-none');
      });
    }

    // small demo: mimic loading then show empty state (no notes)
    setTimeout(() => {
      const wrap = document.querySelector('.loading-wrap');
      if(wrap){
         // keep the "Loading notes..." to match screenshot; if you want to show empty state, you can replace content here.
        // Example of changing to empty state:
       // wrap.innerHTML = '<p class="text-muted">No notes yet — create one!</p>';
      }
    }, 1500);
  </script>
</body>
</html>
